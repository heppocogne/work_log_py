[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "activity-log"
version = "0.1.0"
description = "行動ログツール: タスクの記録とアクティブウィンドウの収集"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
worklog = "activity_log.cli:main"

[tool.setuptools]
packages = ["activity_log"]
